services:
  app:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Pryvance: Host=database;Port=5432;Database=pryvance;Username=postgres
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/api/v1/health"]
      interval: 2s
      timeout: 5s
      retries: 15
    ports:
      - "${PRYVANCE_HTTP_PORT:-8080}:8080"
    networks:
      - edge
      - data

  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: pryvance
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pryvance"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - database-data:/var/lib/postgresql
    networks:
      - data

networks:
  edge:
  data:
    internal: true

volumes:
  database-data:
