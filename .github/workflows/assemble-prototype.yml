name: assemble-prototype

on:
  push:
    branches: [docs/initial-architecture]

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble and validate self-contained prototype
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p prototype
          payload="$(cat .prototype-build/part-*.b64 | tr -d '\n\r')"
          cat > prototype/pryvance-prototype.html <<EOF
          <!doctype html><html><head><meta charset="utf-8"><title>Pryvance Prototype</title></head><body><script>
          (async()=>{const b=Uint8Array.from(atob("${payload}"),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const t=await new Response(new Blob([b]).stream().pipeThrough(ds)).text();document.open();document.write(t);document.close();})().catch(e=>{document.body.innerHTML='<pre>Unable to open Pryvance prototype: '+String(e)+'</pre>';});
          </script></body></html>
          EOF

          python3 - <<'PY'
          import base64, gzip, pathlib, re
          p = pathlib.Path('prototype/pryvance-prototype.html')
          text = p.read_text(encoding='utf-8')
          m = re.search(r'atob\("([A-Za-z0-9+/=]+)"\)', text)
          assert m, 'embedded payload missing'
          unpacked = gzip.decompress(base64.b64decode(m.group(1))).decode('utf-8')
          assert '<html' in unpacked.lower(), 'unpacked prototype is not HTML'
          assert 'support.js' not in unpacked, 'external support.js dependency remains'
          assert 'fonts.googleapis.com' not in unpacked, 'external Google Fonts dependency remains'
          assert 'fonts.gstatic.com' not in unpacked, 'external Google Fonts dependency remains'
          assert len(unpacked) > 100000, 'prototype payload unexpectedly small'
          print(f'validated {len(unpacked):,} bytes of offline prototype HTML')
          PY

          cat > prototype/README.md <<'EOF'
          # Pryvance product prototype

          `pryvance-prototype.html` is the consolidated interactive product/UX prototype used while defining Pryvance.

          It is intentionally stored outside `docs/`: the prototype is a product-design reference artifact, not an architectural source of truth and not part of the adopted Diataxis design set. The durable architecture, domain rules, API contract, security model, roadmap, and ADRs under `docs/` remain authoritative when the prototype and implementation differ.

          The HTML is self-contained for offline viewing. Its supporting JavaScript is embedded and the prototype does not require Google Fonts or other remote assets to render the packaged experience. Open the file in a modern browser; the small outer loader uses the browser `DecompressionStream` API to unpack the embedded prototype in memory.

          Treat fictional names, balances, transactions, institutions, addresses, and documents in the prototype as sample data only.
          EOF

      - name: Replace temporary build payload with final artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .prototype-build
          rm .github/workflows/assemble-prototype.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add consolidated offline Pryvance prototype"
          git push
